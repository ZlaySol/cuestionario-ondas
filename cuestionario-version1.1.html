<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario de Movimiento Ondulatorio</title>
<style>
  :root {
    --bg: #eaf1f5;
    --surface: #ffffff;
    --ink: #1b2b34;
    --muted: #5b6b75;
    --line: #d3e0e7;
    --primary: #2b7a8c;
    --primary-dark: #1f5c6a;
    --primary-soft: #d9edf1;
    --ok: #2e7d55;
    --ok-soft: #dff2e7;
    --bad: #b8433a;
    --bad-soft: #fbe6e3;
    --radius: 14px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 17px;
    line-height: 1.55;
    min-height: 100vh;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1, h2, h3 { font-family: var(--serif); line-height: 1.2; margin: 0; font-weight: 700; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* Portada */
  .cover { text-align: center; padding: 28px 8px 8px; }
  .cover h1 { font-size: clamp(2rem, 7vw, 3rem); margin: 8px 0 14px; }
  .cover p { color: var(--muted); max-width: 32em; margin: 0 auto 10px; }
  .wave-box { overflow: hidden; height: 120px; margin: 0 -16px 8px; }
  .wave-box svg { width: 1600px; height: 120px; animation: drift 9s linear infinite; }
  .wave-box .w2 { animation: none; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-400px); } }
  .facts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 22px 0 28px; }
  .facts span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: .92rem; color: var(--muted); }

  .btn {
    border: 0; border-radius: 12px; padding: 13px 26px; font-weight: 600; font-size: 1rem;
    background: var(--primary); color: #fff; transition: background .15s, transform .05s;
  }
  .btn:hover { background: var(--primary-dark); }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: transparent; color: var(--primary-dark); border: 1.5px solid var(--primary); }
  .btn.ghost:hover { background: var(--primary-soft); }
  .btn[disabled] { background: #b9c9d0; cursor: not-allowed; }
  .btn.big { padding: 16px 40px; font-size: 1.1rem; }

  /* Progreso */
  .progress-head { display: flex; justify-content: space-between; gap: 12px; font-size: .9rem; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
  .bar { height: 10px; background: #cfdde4; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .3s; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 20px; margin-top: 18px; box-shadow: 0 1px 2px rgba(27,43,52,.05); }
  .sec-name { font-size: .95rem; color: var(--primary-dark); font-weight: 600; margin-bottom: 10px; }
  .qtext { font-size: 1.12rem; margin: 0 0 18px; }
  .qtext sub, .qtext sup, .opt sub, .opt sup, .exp sub, .exp sup { font-size: .75em; line-height: 0; }
  .formula { display: block; margin: 8px 0; padding: 8px 12px; background: #f3f8fa; border-radius: 8px; font-family: var(--serif); font-size: 1.05rem; overflow-x: auto; }

  .opts { display: grid; gap: 10px; }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; background: #fff; }
  .opt:hover { border-color: var(--primary); }
  .opt.sel { border-color: var(--primary); background: var(--primary-soft); }
  .opt input { margin: 4px 0 0; accent-color: var(--primary); width: 18px; height: 18px; flex: none; }

  .fields { display: grid; gap: 12px; }
  .field { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .field label { font-family: var(--serif); font-size: 1.05rem; min-width: 4.2em; }
  .field input { width: 9em; max-width: 100%; padding: 10px 12px; font: inherit; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); }
  .field input:focus { border-color: var(--primary); }
  .field .unit { color: var(--muted); }
  .hint { color: var(--muted); font-size: .9rem; margin-top: 14px; }

  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 22px; }

  /* Resultados */
  .score-card { text-align: center; }
  .score-num { font-family: var(--serif); font-size: 4.5rem; line-height: 1; color: var(--primary-dark); }
  .score-num small { font-size: 1.6rem; color: var(--muted); }
  .score-label { font-size: 1.2rem; margin: 6px 0 4px; font-weight: 600; }
  .muted { color: var(--muted); }
  .secs { display: grid; gap: 12px; margin-top: 20px; text-align: left; }
  .sec-row .top { display: flex; justify-content: space-between; gap: 10px; font-size: .95rem; margin-bottom: 4px; }
  .sec-row .bar { height: 8px; }
  .sec-row .bar > i { background: var(--primary); }
  .gaps { margin: 10px 0 0; padding-left: 1.2em; }
  .gaps li { margin: 4px 0; }
  .fb { border-radius: 12px; border: 1px solid var(--line); padding: 16px; margin-top: 14px; background: #fff; }
  .fb h3 { font-size: 1.02rem; margin-bottom: 8px; }
  .tag { display: inline-block; font-size: .82rem; padding: 2px 10px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); margin-bottom: 8px; }
  .ans-row { display: grid; gap: 6px; margin: 10px 0; font-size: .96rem; }
  .ans-row div { padding: 8px 12px; border-radius: 8px; }
  .ans-row .yours { background: var(--bad-soft); }
  .ans-row .right { background: var(--ok-soft); }
  .exp { margin-top: 8px; font-size: .96rem; }
  .allgood { background: var(--ok-soft); color: var(--ok); border-radius: 12px; padding: 14px 16px; margin-top: 14px; font-weight: 600; }
  .retry { text-align: center; margin-top: 28px; }

  .hidden { display: none !important; }
  @media (max-width: 480px) {
    body { font-size: 16px; }
    .card { padding: 18px 14px; }
    .nav .btn { padding: 12px 18px; }
    .score-num { font-size: 3.8rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .wave-box svg { animation: none; }
    .bar > i { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- PORTADA -->
  <section id="cover" class="cover">
    <div class="wave-box" aria-hidden="true">
      <svg viewBox="0 0 1600 120" preserveAspectRatio="none">
        <path d="M0 60 Q100 0 200 60 T400 60 T600 60 T800 60 T1000 60 T1200 60 T1400 60 T1600 60" fill="none" stroke="#2b7a8c" stroke-width="4" stroke-linecap="round"/>
        <path d="M0 60 Q100 20 200 60 T400 60 T600 60 T800 60 T1000 60 T1200 60 T1400 60 T1600 60" fill="none" stroke="#8fc3cd" stroke-width="3" stroke-linecap="round" transform="translate(100 0)"/>
      </svg>
    </div>
    <h1>Cuestionario de Movimiento Ondulatorio</h1>
    <p>Preguntas que piden análisis y despeje, no memoria. Algunas son de opción múltiple y otras numéricas.</p>
    <div class="facts">
      <span>20 preguntas</span>
      <span>5 secciones</span>
      <span>Puntuación de 1 a 5</span>
    </div>
    <button class="btn big" id="startBtn" type="button">Comenzar</button>
    <p class="hint" style="margin-top:22px">Ten a mano calculadora (en radianes) y papel. En las respuestas numéricas puedes usar punto o coma decimal.</p>
  </section>

  <!-- PREGUNTAS -->
  <section id="quiz" class="hidden" aria-live="polite">
    <div class="progress-head">
      <span id="progText"></span>
      <span id="secText"></span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" id="barWrap"><i id="barFill"></i></div>
    <div class="card" id="qcard"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" type="button">Anterior</button>
      <button class="btn" id="nextBtn" type="button">Siguiente</button>
    </div>
  </section>

  <!-- RESULTADOS -->
  <section id="results" class="hidden"></section>

</div>

<script>
(function () {
  "use strict";

  var SECTIONS = [
    "Conceptos fundamentales",
    "Ondas viajeras y función de onda",
    "Velocidad en cuerdas y reflexión/transmisión",
    "Superposición, interferencia y energía",
    "Ecuación de onda lineal"
  ];

  /* type "mc": opts + ans (índice correcto en opts)
     type "num": fields [{label, unit, ans, tol (error relativo permitido)}]  */
  var Q = [
    /* ---------- Sección 1 ---------- */
    { sec: 0, type: "mc", topic: "ondas longitudinales (movimiento de las partículas)",
      q: "Una onda sonora se propaga en el aire hacia la derecha. Sobre las moléculas del aire, ¿cuál afirmación es correcta?",
      opts: [
        "Oscilan paralelas a la dirección de propagación y no se desplazan de forma neta con la onda.",
        "Oscilan perpendicularmente a la propagación y no se desplazan de forma neta con la onda.",
        "Viajan junto con la onda, transportando materia y energía hacia la derecha.",
        "Oscilan paralelas a la propagación, pero avanzan con la onda a la velocidad del sonido."
      ], ans: 0,
      exp: "El sonido es una onda longitudinal: las partículas vibran en la misma dirección en que viaja la onda, alrededor de su posición de equilibrio. La onda transporta energía, no materia neta." },

    { sec: 0, type: "mc", topic: "la rapidez depende del medio; v = λf",
      q: "Una onda senoidal de frecuencia f viaja por una cuerda estirada. Se detiene la cuerda y se genera una segunda onda con la misma amplitud y frecuencia 2f en la misma cuerda (misma tensión). Comparada con la primera, la segunda onda tiene:",
      opts: [
        "La misma rapidez y la mitad de longitud de onda.",
        "El doble de rapidez y la misma longitud de onda.",
        "El doble de rapidez y la mitad de longitud de onda.",
        "La misma rapidez y el doble de longitud de onda."
      ], ans: 0,
      exp: "La rapidez en una cuerda depende sólo del medio (v = √(F/μ)), y como la cuerda no cambió, v es la misma. Con v = λf, si f se duplica, λ se reduce a la mitad. La amplitud no depende de f, así que se mantiene." },

    { sec: 0, type: "num", topic: "partes de una onda: λ, T y f",
      q: "Una cresta pasa por un punto fijo de una cuerda cada 0.25 s. La distancia entre una cresta y el valle contiguo es 0.60 m. ¿Cuál es la rapidez de la onda?",
      fields: [{ label: "v =", unit: "m/s", ans: 4.8, tol: 0.02 }],
      exp: "De cresta a valle contiguo hay media longitud de onda: λ/2 = 0.60 m, entonces λ = 1.20 m. Que una cresta pase cada 0.25 s significa T = 0.25 s. Entonces v = λ/T = 1.20/0.25 = 4.8 m/s." },

    { sec: 0, type: "mc", topic: "ondas combinadas (transversal + longitudinal)",
      q: "Un corcho flota en la superficie del agua y pasa una ola. ¿Cómo describe el movimiento del corcho?",
      opts: [
        "Una trayectoria aproximadamente circular o elíptica: la ola combina movimiento transversal y longitudinal.",
        "Sube y baja en línea recta vertical, porque la ola es puramente transversal.",
        "Avanza junto con la cresta a la velocidad de la ola.",
        "Oscila sólo horizontalmente, porque el agua es un medio longitudinal."
      ], ans: 0,
      exp: "Las olas en la superficie del agua no son puramente transversales ni longitudinales: cada partícula describe un recorrido circular/elíptico. Por eso el corcho sube, baja y se mueve un poco hacia adelante y atrás, pero no viaja con la ola." },

    /* ---------- Sección 2 ---------- */
    { sec: 1, type: "mc", topic: "v = ω/k y comparación de funciones de onda",
      q: "Se tienen cuatro ondas (x en m, t en s):<span class='formula'>a) y = 2 sen(3x − 15t) &nbsp;&nbsp; b) y = 4 sen(3x − 25t)<br>c) y = 6 sen(5x + 15t) &nbsp;&nbsp; d) y = 8 sen(2x + 10t)</span>Ordénalas de mayor a menor según la magnitud de su rapidez de propagación.",
      opts: [
        "b &gt; a = d &gt; c",
        "b &gt; a &gt; d &gt; c",
        "a = d &gt; b &gt; c",
        "c &gt; a = d &gt; b"
      ], ans: 0,
      exp: "Con y = A sen(kx ± ωt), la rapidez es v = ω/k (el signo sólo da la dirección). a: 15/3 = 5 m/s; b: 25/3 ≈ 8.33 m/s; c: 15/5 = 3 m/s; d: 10/2 = 5 m/s. Orden: b &gt; a = d &gt; c. La amplitud no influye en la rapidez." },

    { sec: 1, type: "num", topic: "cálculo de k, ω y evaluación de y(x,t)",
      q: "Una onda senoidal de amplitud 0.20 m viaja hacia +x con v = 4.0 m/s. Cada partícula del medio completa 50 oscilaciones en 10 s. Con <b>y = A sen(kx − ωt)</b> calcula el número de onda k y la elongación y<sub>1</sub> de una partícula ubicada en x = 1.3λ en el instante t = 1.2T (calculadora en radianes).",
      fields: [
        { label: "k =", unit: "rad/m", ans: 7.854, tol: 0.02 },
        { label: "y<sub>1</sub> =", unit: "m", ans: 0.1176, tol: 0.05 }
      ],
      exp: "f = 50/10 = 5 Hz, T = 0.2 s, ω = 2πf = 10π rad/s, λ = v/f = 0.8 m y k = 2π/λ = 2.5π ≈ 7.85 rad/m. La fase es kx − ωt = 2π(1.3) − 2π(1.2) = 0.2π rad, así que y<sub>1</sub> = 0.20·sen(0.2π) = 0.20·0.588 ≈ 0.118 m." },

    { sec: 1, type: "mc", topic: "pulsos f(x ± vt): amplitud y dirección",
      q: "Un pulso viaja por una cuerda y su forma es <span class='formula'>y(x,t) = 8 / [ (x + 2t)² + 4 ] &nbsp; (SI)</span>¿Cuál descripción es correcta?",
      opts: [
        "Amplitud 2 m; en t = 3 s su máximo está en x = −6 m (viaja hacia −x).",
        "Amplitud 2 m; en t = 3 s su máximo está en x = +6 m (viaja hacia +x).",
        "Amplitud 8 m; en t = 3 s su máximo está en x = −6 m.",
        "Amplitud 4 m; en t = 3 s su máximo está en x = −12 m."
      ], ans: 0,
      exp: "El máximo ocurre cuando el denominador es mínimo: x + 2t = 0, y entonces y<sub>máx</sub> = 8/4 = 2 m (no 8). Como la función depende de (x + vt) con v = 2 m/s, el pulso viaja hacia −x. En t = 3 s: x = −2(3) = −6 m." },

    { sec: 1, type: "num", topic: "identificar k, ω, v y dirección",
      q: "Una onda en una cuerda está dada por <span class='formula'>y = 0.03 sen(5x + 30t) &nbsp; (SI)</span>Halla su velocidad de propagación con signo (positivo si va hacia +x) y su longitud de onda.",
      fields: [
        { label: "v =", unit: "m/s (con signo)", ans: -6, tol: 0.01 },
        { label: "λ =", unit: "m", ans: 1.2566, tol: 0.02 }
      ],
      exp: "Aquí k = 5 rad/m y ω = 30 rad/s, entonces |v| = ω/k = 6 m/s. Como kx y ωt tienen el mismo signo (x + vt), la onda viaja hacia −x, por lo que v = −6 m/s. La longitud de onda es λ = 2π/k = 2π/5 ≈ 1.26 m." },

    /* ---------- Sección 3 ---------- */
    { sec: 2, type: "num", topic: "despeje de F en v = √(F/μ)",
      q: "Una cuerda uniforme de 8.0 m de longitud y 0.80 kg de masa está tensa. Un pulso la recorre de un extremo al otro en 0.20 s. ¿Qué tensión tiene la cuerda?",
      fields: [{ label: "F =", unit: "N", ans: 160, tol: 0.02 }],
      exp: "μ = m/L = 0.80/8.0 = 0.10 kg/m y v = L/t = 8.0/0.20 = 40 m/s. Despejando v = √(F/μ) queda F = μv² = 0.10·40² = 160 N." },

    { sec: 2, type: "num", topic: "proporcionalidad de v con F y μ",
      q: "Se cuadruplica la tensión de una cuerda y, al cambiarla, su densidad lineal μ se reduce a la mitad. ¿Por qué factor se multiplica la rapidez de las ondas en ella?",
      fields: [{ label: "v₂/v₁ =", unit: "", ans: 2.828, tol: 0.02 }],
      exp: "Como v = √(F/μ), el factor es √(4 / ½) = √8 ≈ 2.83. El error típico es olvidar la raíz y responder 8." },

    { sec: 2, type: "mc", topic: "reflexión y transmisión al cambiar de medio",
      q: "Un pulso positivo viaja por una cuerda liviana y llega a la unión con una cuerda más pesada (misma tensión). ¿Qué ocurre?",
      opts: [
        "El pulso reflejado se invierte y el transmitido no; el transmitido viaja más lento.",
        "El pulso reflejado no se invierte y el transmitido viaja más rápido.",
        "Ambos pulsos, reflejado y transmitido, se invierten.",
        "El pulso reflejado se invierte y el transmitido viaja más rápido."
      ], ans: 0,
      exp: "De liviana a pesada (medio más denso) la reflexión invierte el pulso (cambio de fase de 180°); el transmitido nunca se invierte. La rapidez transmitida es menor porque μ es mayor: v = √(F/μ). El reflejado conserva la rapidez porque sigue en el mismo medio." },

    { sec: 2, type: "mc", topic: "reflexión en extremo fijo/libre y de pesada a liviana",
      q: "Para un pulso positivo incidente, ¿cuál conjunto de afirmaciones es totalmente correcto?",
      opts: [
        "Extremo fijo: se invierte. Extremo libre: no se invierte. Cuerda pesada → liviana: el reflejado no se invierte.",
        "Extremo fijo: se invierte. Extremo libre: se invierte. Cuerda pesada → liviana: el reflejado se invierte.",
        "Extremo fijo: no se invierte. Extremo libre: se invierte. Cuerda liviana → pesada: no se invierte.",
        "Extremo fijo: se invierte. Extremo libre: no se invierte. Cuerda pesada → liviana: el reflejado se invierte."
      ], ans: 0,
      exp: "Extremo fijo: la pared ejerce una fuerza que invierte el pulso. Extremo libre (anillo sin fricción): se refleja sin invertirse. Pasar de un medio más denso a uno menos denso se comporta como un extremo libre: el reflejado no se invierte y parte se transmite." },

    /* ---------- Sección 4 ---------- */
    { sec: 3, type: "num", topic: "interferencia constructiva/destructiva y desfase",
      q: "Dos ondas armónicas de igual frecuencia viajan por el mismo medio, con A<sub>1</sub> = 3.0 cm y A<sub>2</sub> = 5.0 cm. Calcula la amplitud de la onda resultante si el desfase entre ellas es (a) 0 y (b) 3π rad.",
      fields: [
        { label: "(a) A<sub>R</sub> =", unit: "cm", ans: 8, tol: 0.01 },
        { label: "(b) A<sub>R</sub> =", unit: "cm", ans: 2, tol: 0.01 }
      ],
      exp: "(a) En fase: interferencia constructiva, A<sub>R</sub> = 3 + 5 = 8 cm. (b) Un desfase de 3π equivale a π (se restan vueltas de 2π): interferencia destructiva, A<sub>R</sub> = |5 − 3| = 2 cm." },

    { sec: 3, type: "mc", topic: "energía en la interferencia destructiva",
      q: "Dos pulsos triangulares idénticos, uno hacia arriba y otro hacia abajo, viajan en sentidos opuestos por una cuerda. En el instante en que se superponen exactamente, la cuerda se ve completamente recta. ¿Qué pasó con la energía?",
      opts: [
        "Es energía cinética: los elementos de la cuerda se mueven con rapidez máxima aunque la cuerda parezca plana.",
        "Se destruyó por la interferencia destructiva y reaparece después por reflexión.",
        "Es cero, porque y = 0 en todos los puntos.",
        "Se duplicó, por el principio de superposición."
      ], ans: 0,
      exp: "La superposición suma desplazamientos, no energías. Con y = 0 la energía potencial elástica es mínima, pero la energía total se conserva: está en forma de energía cinética, porque cada punto de la cuerda tiene velocidad. Los pulsos siguen su camino intactos después de cruzarse." },

    { sec: 3, type: "num", topic: "cálculo de f y de potencia P",
      q: "Si v = 20 m/s y λ = 4 m, ¿cuál es f? Luego, si A = 0.5 m y la cuerda tiene μ = 0.05 kg/m, ¿cuál es la potencia media transmitida? Usa <b>P = ½ μ ω² A² v</b>.",
      fields: [
        { label: "f =", unit: "Hz", ans: 5, tol: 0.01 },
        { label: "P =", unit: "W", ans: 123.37, tol: 0.02 }
      ],
      exp: "f = v/λ = 20/4 = 5 Hz. Después ω = 2πf ≈ 31.42 rad/s (usa ω, no f). P = ½(0.05)(31.42)²(0.5)²(20) ≈ 123 W." },

    { sec: 3, type: "num", topic: "proporcionalidad de la potencia (ω²A²)",
      q: "En una misma cuerda con tensión fija, se triplica la amplitud de la onda y se reduce a la mitad su frecuencia. ¿Por qué factor se multiplica la potencia transmitida?",
      fields: [{ label: "P₂/P₁ =", unit: "", ans: 2.25, tol: 0.01 }],
      exp: "P = ½ μ ω² A² v. La cuerda y la tensión no cambian, así que μ y v tampoco. Sólo cambian ω (×½) y A (×3): P₂/P₁ = (½)²·3² = 9/4 = 2.25." },

    /* ---------- Sección 5 ---------- */
    { sec: 4, type: "mc", topic: "verificar soluciones de la ecuación de onda",
      q: "La ecuación de onda lineal es <span class='formula'>∂²y/∂x² = (1/v²) ∂²y/∂t²</span>¿Cuáles de estas funciones (SI) la satisfacen con v = 4 m/s?<span class='formula'>I) y = 5 sen(3x + 12t) &nbsp; II) y = 2 cos(2x − 6t)<br>III) y = 0.1(x − 4t)² &nbsp; IV) y = 7 sen(4x − 8t)</span>",
      opts: [
        "Sólo I",
        "I y III",
        "II y IV",
        "I, II y III"
      ], ans: 1,
      exp: "Para una senoidal, v = ω/k: I) 12/3 = 4 ✓; II) 6/2 = 3 ✗; IV) 8/4 = 2 ✗. La III es de la forma f(x − 4t): cualquier función derivable de (x − vt) cumple la ecuación con esa v (∂²y/∂x² = 0.2 y ∂²y/∂t² = 3.2 = 16·0.2 ✓). Respuesta: I y III." },

    { sec: 4, type: "num", topic: "despeje de v y ω desde la ecuación de onda",
      q: "Una onda y = A sen(kx − ωt) satisface <span class='formula'>∂²y/∂t² = 25 ∂²y/∂x²</span>con k = 2.5 rad/m. Calcula v y ω.",
      fields: [
        { label: "v =", unit: "m/s", ans: 5, tol: 0.01 },
        { label: "ω =", unit: "rad/s", ans: 12.5, tol: 0.01 }
      ],
      exp: "Al comparar con ∂²y/∂t² = v² ∂²y/∂x², el coeficiente es v² = 25, así que v = 5 m/s (no 25). Luego ω = vk = 5·2.5 = 12.5 rad/s." },

    { sec: 4, type: "num", topic: "aplicar v² = F/μ y f = v/λ",
      q: "Una cuerda de μ = 0.10 kg/m está bajo una tensión F = 90 N. Su ecuación de onda es ∂²y/∂t² = C ∂²y/∂x². Calcula C y, para una onda de λ = 1.5 m, la frecuencia f.",
      fields: [
        { label: "C =", unit: "m²/s²", ans: 900, tol: 0.01 },
        { label: "f =", unit: "Hz", ans: 20, tol: 0.01 }
      ],
      exp: "El coeficiente de la ecuación es C = v² = F/μ = 90/0.10 = 900 m²/s². Entonces v = 30 m/s y f = v/λ = 30/1.5 = 20 Hz." },

    { sec: 4, type: "mc", topic: "hipótesis de la ecuación de onda lineal (ángulos pequeños)",
      q: "En la deducción de la ecuación de onda lineal para una cuerda, ¿qué suposición es indispensable?",
      opts: [
        "Los ángulos con la horizontal son pequeños, de modo que senθ ≈ tanθ ≈ ∂y/∂x y la tensión es prácticamente constante.",
        "La cuerda no tiene masa, para que la segunda ley de Newton no incluya inercia.",
        "La frecuencia es constante, para que todos los puntos oscilen en fase.",
        "La amplitud es mayor que la longitud de onda, para que el pulso sea visible."
      ], ans: 0,
      exp: "Se aplica la segunda ley de Newton a un pequeño segmento de cuerda de masa μΔx (la masa sí importa). Con ángulos pequeños, senθ ≈ tanθ ≈ ∂y/∂x y la tensión F se toma constante; así se llega a ∂²y/∂x² = (μ/F) ∂²y/∂t² con v² = F/μ." }
  ];

  var N = Q.length;
  var state = null;

  var $ = function (id) { return document.getElementById(id); };
  var cover = $("cover"), quiz = $("quiz"), results = $("results");

  function shuffle(a) {
    var r = a.slice();
    for (var i = r.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = r[i]; r[i] = r[j]; r[j] = t;
    }
    return r;
  }

  function newState() {
    return {
      cur: 0,
      answers: Q.map(function (q) {
        return q.type === "mc" ? null : q.fields.map(function () { return ""; });
      }),
      order: Q.map(function (q) {
        return q.type === "mc" ? shuffle(q.opts.map(function (_, i) { return i; })) : null;
      })
    };
  }

  function parseNum(s) {
    if (s === null || s === undefined) return NaN;
    s = String(s).trim().replace(",", ".").replace(/\s+/g, "");
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(s)) return NaN;
    return parseFloat(s);
  }

  function fieldOk(f, raw) {
    var v = parseNum(raw);
    if (!isFinite(v)) return false;
    return Math.abs(v - f.ans) <= Math.abs(f.ans) * f.tol;
  }

  function isCorrect(i) {
    var q = Q[i], a = state.answers[i];
    if (q.type === "mc") return a === q.ans;
    return q.fields.every(function (f, k) { return fieldOk(f, a[k]); });
  }

  function isAnswered(i) {
    var q = Q[i], a = state.answers[i];
    if (q.type === "mc") return a !== null;
    return a.every(function (x) { return isFinite(parseNum(x)); });
  }

  /* ---------- Render de pregunta ---------- */
  function renderQuestion() {
    var i = state.cur, q = Q[i];
    $("progText").textContent = "Pregunta " + (i + 1) + " de " + N;
    $("secText").textContent = "Sección " + (q.sec + 1) + " de " + SECTIONS.length;
    $("barFill").style.width = ((i + 1) / N * 100) + "%";
    $("barWrap").setAttribute("aria-valuenow", String(i + 1));
    $("barWrap").setAttribute("aria-label", "Pregunta " + (i + 1) + " de " + N);

    var html = "<div class='sec-name'>" + SECTIONS[q.sec] + "</div>";
    html += "<p class='qtext'>" + q.q + "</p>";

    if (q.type === "mc") {
      html += "<div class='opts' role='radiogroup'>";
      state.order[i].forEach(function (oi) {
        var sel = state.answers[i] === oi;
        html += "<label class='opt" + (sel ? " sel" : "") + "'>" +
                "<input type='radio' name='q" + i + "' value='" + oi + "'" + (sel ? " checked" : "") + ">" +
                "<span>" + q.opts[oi] + "</span></label>";
      });
      html += "</div>";
    } else {
      html += "<div class='fields'>";
      q.fields.forEach(function (f, k) {
        var val = state.answers[i][k].replace(/"/g, "&quot;");
        html += "<div class='field'><label for='f" + k + "'>" + f.label + "</label>" +
                "<input id='f" + k + "' data-k='" + k + "' type='text' inputmode='decimal' autocomplete='off' value=\"" + val + "\">" +
                (f.unit ? "<span class='unit'>" + f.unit + "</span>" : "") + "</div>";
      });
      html += "</div><p class='hint'>Escribe sólo el número. Se acepta un margen pequeño por redondeo.</p>";
    }
    $("qcard").innerHTML = html;

    if (q.type === "mc") {
      var radios = $("qcard").querySelectorAll("input[type=radio]");
      Array.prototype.forEach.call(radios, function (r) {
        r.addEventListener("change", function () {
          state.answers[i] = parseInt(r.value, 10);
          Array.prototype.forEach.call($("qcard").querySelectorAll(".opt"), function (l) {
            l.classList.toggle("sel", l.querySelector("input").checked);
          });
          updateNav();
        });
      });
    } else {
      var inputs = $("qcard").querySelectorAll("input[type=text]");
      Array.prototype.forEach.call(inputs, function (inp) {
        inp.addEventListener("input", function () {
          state.answers[i][parseInt(inp.getAttribute("data-k"), 10)] = inp.value;
          updateNav();
        });
        inp.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && isAnswered(state.cur)) { e.preventDefault(); next(); }
        });
      });
    }
    updateNav();
    window.scrollTo(0, 0);
  }

  function updateNav() {
    $("prevBtn").disabled = state.cur === 0;
    $("prevBtn").style.visibility = state.cur === 0 ? "hidden" : "visible";
    $("nextBtn").textContent = state.cur === N - 1 ? "Ver resultados" : "Siguiente";
    $("nextBtn").disabled = !isAnswered(state.cur);
  }

  function next() {
    if (!isAnswered(state.cur)) return;
    if (state.cur === N - 1) { showResults(); return; }
    state.cur++;
    renderQuestion();
  }
  function prev() {
    if (state.cur > 0) { state.cur--; renderQuestion(); }
  }

  /* ---------- Resultados ---------- */
  function scoreFrom(pct) {
    if (pct >= 0.9) return 5;
    if (pct >= 0.75) return 4;
    if (pct >= 0.55) return 3;
    if (pct >= 0.35) return 2;
    return 1;
  }
  var LABELS = {
    5: "Excelente: dominas el tema.",
    4: "Muy bien: sólo te faltan detalles.",
    3: "Aceptable: hay huecos que conviene repasar.",
    2: "Necesitas repasar varios temas.",
    1: "Empieza por revisar los conceptos base."
  };

  function fmt(x) {
    var a = Math.abs(x);
    var d = a >= 100 ? 1 : (a >= 10 ? 2 : 3);
    return String(parseFloat(x.toFixed(d))).replace(".", ",");
  }

  function showResults() {
    quiz.classList.add("hidden");
    results.classList.remove("hidden");

    var ok = [], bad = [];
    var perSec = SECTIONS.map(function () { return { ok: 0, n: 0 }; });
    for (var i = 0; i < N; i++) {
      var c = isCorrect(i);
      (c ? ok : bad).push(i);
      perSec[Q[i].sec].n++;
      if (c) perSec[Q[i].sec].ok++;
    }
    var pct = ok.length / N;
    var score = scoreFrom(pct);

    var html = "<div class='card score-card'>" +
      "<div class='muted'>Tu puntuación</div>" +
      "<div class='score-num'>" + score + "<small> / 5</small></div>" +
      "<div class='score-label'>" + LABELS[score] + "</div>" +
      "<div class='muted'>" + ok.length + " de " + N + " respuestas correctas (" + Math.round(pct * 100) + "%)</div>" +
      "<div class='secs'>";
    SECTIONS.forEach(function (s, k) {
      var p = perSec[k].ok / perSec[k].n * 100;
      html += "<div class='sec-row'><div class='top'><span>" + s + "</span><span>" + perSec[k].ok + "/" + perSec[k].n + "</span></div>" +
              "<div class='bar'><i style='width:" + p + "%'></i></div></div>";
    });
    html += "</div></div>";

    if (bad.length === 0) {
      html += "<div class='allgood'>No fallaste ninguna pregunta. No hay temas huecos.</div>";
    } else {
      var seen = {}, topics = [];
      bad.forEach(function (i) {
        var t = Q[i].topic;
        if (!seen[t]) { seen[t] = 1; topics.push(t); }
      });
      html += "<div class='card'><h2 style='font-size:1.3rem'>Temas huecos</h2>" +
              "<p class='muted' style='margin:6px 0 0'>Fallaste en:</p><ul class='gaps'>";
      topics.forEach(function (t) { html += "<li>" + t + "</li>"; });
      html += "</ul></div>";

      html += "<h2 style='font-size:1.3rem;margin:26px 0 4px'>Retroalimentación de las preguntas falladas</h2>";
      bad.forEach(function (i) {
        var q = Q[i], a = state.answers[i];
        html += "<div class='fb'><span class='tag'>Sección " + (q.sec + 1) + " · " + q.topic + "</span>" +
                "<h3>Pregunta " + (i + 1) + "</h3><p class='qtext' style='font-size:1rem;margin:0 0 6px'>" + q.q + "</p>";
        html += "<div class='ans-row'>";
        if (q.type === "mc") {
          html += "<div class='yours'><b>Tu respuesta:</b> " + q.opts[a] + "</div>" +
                  "<div class='right'><b>Correcta:</b> " + q.opts[q.ans] + "</div>";
        } else {
          q.fields.forEach(function (f, k) {
            var good = fieldOk(f, a[k]);
            html += "<div class='" + (good ? "right" : "yours") + "'>" + f.label + " <b>" + String(a[k]).trim() + "</b> " + f.unit +
                    (good ? " (bien)" : " &nbsp;→&nbsp; correcto ≈ <b>" + fmt(f.ans) + "</b> " + f.unit) + "</div>";
          });
        }
        html += "</div><div class='exp'>" + q.exp + "</div></div>";
      });
    }

    html += "<div class='retry'><button class='btn big' id='retryBtn' type='button'>Reintentar</button></div>";
    results.innerHTML = html;
    $("retryBtn").addEventListener("click", start);
    window.scrollTo(0, 0);
  }

  function start() {
    state = newState();
    cover.classList.add("hidden");
    results.classList.add("hidden");
    results.innerHTML = "";
    quiz.classList.remove("hidden");
    renderQuestion();
  }

  $("startBtn").addEventListener("click", start);
  $("nextBtn").addEventListener("click", next);
  $("prevBtn").addEventListener("click", prev);
})();
</script>
</body>
</html>
