<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Generador de exámenes · Movimiento Ondulatorio</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="estilo.css?v=2">
</head>
<body>
<div class="wrap">

  <!-- CAMBIO DE TEMA -->
  <div class="topbar">
    <button class="btn ghost small" id="themeBtn" type="button" aria-pressed="false">Modo oscuro</button>
  </div>

  <!-- PORTADA -->
  <section id="cover" class="cover" aria-labelledby="coverTitle">
    <div class="wave-box" aria-hidden="true">
      <svg viewBox="0 0 1600 120" preserveAspectRatio="none">
        <path d="M0 60 Q100 0 200 60 T400 60 T600 60 T800 60 T1000 60 T1200 60 T1400 60 T1600 60" fill="none" stroke="#2b7a8c" stroke-width="4" stroke-linecap="round"/>
        <path d="M0 60 Q100 20 200 60 T400 60 T600 60 T800 60 T1000 60 T1200 60 T1400 60 T1600 60" fill="none" stroke="#8fc3cd" stroke-width="3" stroke-linecap="round" transform="translate(100 0)"/>
      </svg>
    </div>
    <h1 id="coverTitle">Generador de exámenes de Movimiento Ondulatorio</h1>
    <p>Refuerza tus conocimientos</p>
    <div class="facts" id="facts"></div>

    <fieldset class="modes">
      <legend>Elige el modo</legend>
      <label class="mode-opt sel" id="modeLabelExam">
        <input type="radio" name="mode" value="exam" checked>
        <span><b>Examen</b><small>Sin ayudas. Es la nota que cuenta.</small></span>
      </label>
      <label class="mode-opt" id="modeLabelPractice">
        <input type="radio" name="mode" value="practice">
        <span><b>Práctica</b><small>Con hoja de fórmulas de cada sección a la mano.</small></span>
      </label>
    </fieldset>

    <div class="actions">
      <button class="btn big" id="startBtn" type="button">Comenzar</button>
      <button class="btn ghost hidden" id="resumeBtn" type="button">Continuar examen</button>
      <button class="btn ghost hidden" id="reviewBtn" type="button">Revisar examen anterior</button>
    </div>
    <p class="hint hint-top">Ten a mano calculadora (en radianes) y papel. En las respuestas numéricas puedes usar punto o coma decimal.</p>
  </section>

  <!-- PREGUNTAS -->
  <section id="quiz" class="hidden" aria-label="Examen en curso">
    <div class="progress-head">
      <span id="progText"></span>
      <span id="secText"></span>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="20" id="barWrap"><i id="barFill"></i></div>
    <div class="tools">
      <span class="badge" id="modeBadge"></span>
      <button class="btn ghost small" id="pauseBtn" type="button">Pausar y salir</button>
    </div>
    <div class="card" id="qcard"></div>
    <div class="nav">
      <button class="btn ghost" id="prevBtn" type="button">Anterior</button>
      <button class="btn" id="nextBtn" type="button">Siguiente</button>
    </div>
    <div class="sr-only" id="srStatus" aria-live="polite"></div>
  </section>

  <!-- RESULTADOS -->
  <section id="results" class="hidden" aria-label="Resultados"></section>

</div>

<script src="motor.js?v=2"></script>
</body>
</html>
